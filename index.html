<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>मराठी क्राइम फाईल्स</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e40af">
<script src="https://cdn.tailwindcss.com"></script>

<style>
body{margin:0;font-family:Arial,sans-serif;background:#f6f7fb}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:#1e40af;color:white;position:sticky;top:0;z-index:300}
.posts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;padding:10px}
.card{background:#fff;border-radius:10px;box-shadow:0 4px 12px rgba(0,0,0,.1);cursor:pointer}
.card img{width:100%;border-radius:10px 10px 0 0}
.card-body{padding:8px}
#modalBg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);justify-content:center;align-items:center;z-index:1000}
#modalContent{background:#fff;padding:15px;border-radius:10px;max-width:600px;width:90%;max-height:90vh;overflow:auto}
#imageCarousel{height:220px;overflow:hidden}
#carouselInner{display:flex;transition:transform 1s}
#carouselInner img{width:100%;object-fit:cover}
</style>
</head>

<body>

<header>
  <h1 class="font-bold">मराठी क्राइम फाईल्स</h1>
  <div>
    <button id="loginBtn" class="bg-green-500 px-3 py-1 rounded">Login</button>
    <button id="logoutBtn" class="bg-red-500 px-3 py-1 rounded hidden">Logout</button>
  </div>
</header>

<div id="imageCarousel">
  <div id="carouselInner"></div>
</div>

<section id="editorArea" class="hidden p-3 bg-white m-2 rounded">
  <input id="aTitle" placeholder="Title" class="border p-2 w-full mb-2">
  <div id="blocksList"></div>
  <button id="addTextBtn" class="bg-blue-500 text-white px-3 py-1 rounded">Add Text</button>
  <button id="publishBtn" class="bg-green-600 text-white px-3 py-1 rounded">Publish</button>
</section>

<section id="postsArea" class="posts-grid"></section>

<div id="modalBg">
  <div id="modalContent"></div>
</div>

<!-- 🔥 SCRIPT ALWAYS AT END -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCLCUAiPz-sqhFDskG9g9AwyUI1RdTQWfk",
  authDomain: "marathi-crime-files.firebaseapp.com",
  projectId: "marathi-crime-files",
  storageBucket: "marathi-crime-files.appspot.com",
  messagingSenderId: "973325762370",
  appId: "1:973325762370:web:4fb97306806bbe6cc0d2db"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();
const ADMIN_EMAIL = "gulistankh2011@gmail.com";

const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");
const editorArea = document.getElementById("editorArea");
const postsArea = document.getElementById("postsArea");
const blocksList = document.getElementById("blocksList");
const modalBg = document.getElementById("modalBg");
const modalContent = document.getElementById("modalContent");

loginBtn.onclick = () => signInWithPopup(auth, provider);
logoutBtn.onclick = () => signOut(auth);

onAuthStateChanged(auth, user => {
  if (user && user.email === ADMIN_EMAIL) {
    editorArea.classList.remove("hidden");
    loginBtn.classList.add("hidden");
    logoutBtn.classList.remove("hidden");
  } else {
    editorArea.classList.add("hidden");
    loginBtn.classList.remove("hidden");
    logoutBtn.classList.add("hidden");
  }
});

document.getElementById("addTextBtn").onclick = () => {
  const t = document.createElement("textarea");
  t.className = "border p-2 w-full mb-2";
  blocksList.appendChild(t);
};

document.getElementById("publishBtn").onclick = async () => {
  const title = aTitle.value.trim();
  if (!title) return alert("Title required");

  const blocks = [...blocksList.children].map(t => ({
    type: "text",
    text: t.value
  }));

  await addDoc(collection(db, "news"), {
    title,
    blocks,
    time: Date.now()
  });

  blocksList.innerHTML = "";
  aTitle.value = "";
};

onSnapshot(query(collection(db,"news"),orderBy("time","desc")), snap => {
  postsArea.innerHTML="";
  snap.forEach(d=>{
    const post=d.data();
    const div=document.createElement("div");
    div.className="card";
    div.innerHTML=`<div class="card-body"><h3>${post.title}</h3></div>`;
    div.onclick=()=>{
      modalContent.innerHTML=`<h2>${post.title}</h2><p>${post.blocks[0]?.text||""}</p>`;
      modalBg.style.display="flex";
    };
    postsArea.appendChild(div);
  });
});

modalBg.onclick=e=>{ if(e.target===modalBg) modalBg.style.display="none"; }
</script>

</body>
</html>
